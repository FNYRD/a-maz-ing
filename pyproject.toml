[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator module"
authors = [
    {name = "Jesus Rosales",email = "jr.jobs.1509@gmail.com"},
    {name = "Sergio Gabriel Lenti",email = "slenti@student.42porto.com"}
]
readme = "mazegen/README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true